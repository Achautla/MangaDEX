# Compila el APK de Android cada vez que subes cambios a GitHub.
# El APK queda en la pestaña "Releases" del repositorio (y en "Actions" como artefacto).
name: Compilar APK

on:
  push:
    branches: [main, master]
    paths-ignore: ['**.zip']   # los zips los procesa "desde-zip.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      - name: Instalar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Instalar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar el SDK de Android (ya viene instalado en GitHub)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null || echo "Aviso: Gradle descargará lo que falte"

      - name: Ubicar el proyecto
        id: p
        run: |
          # El proyecto puede estar en la raíz o dentro de una carpeta (por ejemplo "lector-manga/")
          if [ -f package.json ] && [ -f capacitor.config.json ]; then
            DIR=.
          else
            CFG=$(find . -path ./.git -prune -o -path '*/node_modules' -prune -o -name capacitor.config.json -print | head -1)
            DIR=$(dirname "${CFG:-/nada/x}")
          fi
          if [ ! -f "$DIR/package.json" ]; then
            if ls *.zip >/dev/null 2>&1; then
              echo "::error::Hay un .zip sin descomprimir en el repositorio. Agrega .github/workflows/desde-zip.yml para que se descomprima solo, o sube los archivos ya descomprimidos."
            else
              echo "::error::No encontré package.json ni capacitor.config.json. Sube el contenido completo de la carpeta lector-manga."
            fi
            exit 1
          fi
          echo "Proyecto en: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Instalar dependencias
        working-directory: ${{ steps.p.outputs.dir }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else echo "Sin package-lock.json: uso npm install"; npm install; fi

      - name: Preparar la app y el proyecto Android
        working-directory: ${{ steps.p.outputs.dir }}
        run: npm run android:prepare

      - name: Usar siempre la misma firma (para poder actualizar sin desinstalar)
        working-directory: ${{ steps.p.outputs.dir }}
        run: |
          mkdir -p ~/.android
          cp android-signing/debug.keystore ~/.android/debug.keystore

      - name: Compilar el APK
        working-directory: ${{ steps.p.outputs.dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renombrar
        run: cp "${{ steps.p.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk" MangaDex.apk

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v6
        with:
          name: MangaDex-apk
          path: MangaDex.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MangaDex 1.0.${{ github.run_number }}
          body: |
            APK compilado automáticamente desde el commit ${{ github.sha }}.
            Descárgalo en tu teléfono Android y ábrelo para instalar (o actualizar) la app.
          files: MangaDex.apk
          make_latest: true
