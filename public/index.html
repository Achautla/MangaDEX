  <script>
    // Aplica el tema antes de pintar para evitar parpadeo (claro por defecto).
    (function () {
      var t = 'light';
      try { t = localStorage.getItem('theme') || 'light'; } catch (e) {}
      if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
      document.querySelector('meta[name=viewport]').insertAdjacentHTML('afterend', '<meta name="theme-color" content="' + (t === 'dark' ? '#0f141b' : '#f5f7fa') + '">');
    })();
  </script>
