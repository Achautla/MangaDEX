# Compila el APK de Android cada vez que subes cambios a GitHub.
# El APK queda en la pestaña "Releases" del repositorio (y en "Actions" como artefacto).
name: Compilar APK

on:
  push:
    branches: [main, master]
    paths-ignore: ['**.zip']   # los zips los procesa "desde-zip.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar el SDK de Android
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar la app y el proyecto Android
        run: npm run android:prepare

      - name: Usar siempre la misma firma (para poder actualizar sin desinstalar)
        run: |
          mkdir -p ~/.android
          cp android-signing/debug.keystore ~/.android/debug.keystore

      - name: Compilar el APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renombrar
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MangaDex.apk

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MangaDex-apk
          path: MangaDex.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MangaDex 1.0.${{ github.run_number }}
          body: |
            APK compilado automáticamente desde el commit ${{ github.sha }}.
            Descárgalo en tu teléfono Android y ábrelo para instalar (o actualizar) la app.
          files: MangaDex.apk
          make_latest: true
